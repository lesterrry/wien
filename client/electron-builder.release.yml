extends: ./electron-builder.yml
artifactName: Wien-${version}-${os}-${arch}.${ext}
extraMetadata:
  homepage: https://github.com/lesterrry/wien
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  executableName: wien
  category: AudioVideo
  maintainer: Wien
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
