services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    init: true
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      WIEN_SERVER_HOST: 0.0.0.0
      WIEN_SERVER_PORT: "3001"
      WIEN_SERVER_CONFIG: /app/config.toml
      DATABASE_URL: postgresql://wien:${POSTGRES_PASSWORD:-wien-local-only}@database:5432/wien
      AITUNNEL_KEY: ${AITUNNEL_KEY:?Set AITUNNEL_KEY in the environment or root .env}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      STRUDEL_RAG_ENDPOINT: http://skill:50051
      STRUDEL_RAG_BEARER_TOKEN: ${STRUDEL_RAG_BEARER_TOKEN:?Set STRUDEL_RAG_BEARER_TOKEN in the environment or root .env}
    ports:
      - "127.0.0.1:${WIEN_SERVER_PORT:-3001}:3001"
    volumes:
      - type: bind
        source: ${WIEN_SERVER_CONFIG:-./server/config.toml}
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy
      skill:
        condition: service_healthy

  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wien
      POSTGRES_DB: wien
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wien-local-only}
    volumes:
      - users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wien -d wien"]
      interval: 5s
      timeout: 3s
      retries: 12

  skill:
    build:
      context: .
      dockerfile: Dockerfile
      target: skill
    init: true
    restart: unless-stopped
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      STRUDEL_RAG_BEARER_TOKEN: ${STRUDEL_RAG_BEARER_TOKEN:?Set STRUDEL_RAG_BEARER_TOKEN in the environment or root .env}
      AITUNNEL_KEY: ${AITUNNEL_KEY:?Set AITUNNEL_KEY in the environment or root .env}
      STRUDEL_RAG_EMBEDDING_MODEL: ${STRUDEL_RAG_EMBEDDING_MODEL:-text-embedding-3-small}
    ports:
      - "127.0.0.1:${STRUDEL_RAG_PORT:-50051}:50051"
    volumes:
      - type: bind
        source: ${STRUDEL_RAG_CONFIG:-./skill/config.toml}
        target: /app/config.toml
        read_only: true
        bind:
          create_host_path: false
      - skill-data:/var/lib/strudel-rag
      - ./skill/saved_html:/app/saved_html:ro

volumes:
  users-data:
  skill-data:

networks:
  default:
    enable_ipv6: ${WIEN_DOCKER_IPV6:-false}
