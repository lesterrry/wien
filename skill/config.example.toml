# Copy to strudel-rag.toml and adjust paths/model for your deployment.
# Relative paths are resolved from this file's directory. Never put secrets here.
data_dir = "./data"
sources_manifest = "./corpus/sources.toml"

[embedding]
provider = "http"
base_url = "https://api.openai.com/v1/"
model = "text-embedding-3-small"
api_key_env = "OPENAI_API_KEY"
batch_size = 32
timeout_secs = 30
max_retries = 3
# dimensions = 1536

[chunking]
target_tokens_approx = 500
max_tokens_approx = 800

[retrieval]
candidate_k = 20
top_k = 8
max_top_k = 50
rrf_k = 60
min_cosine = 0.3

[server]
bind = "127.0.0.1:50051"
bearer_token_env = "STRUDEL_RAG_BEARER_TOKEN"
timeout_secs = 30
max_request_bytes = 65536
max_response_bytes = 16777216
max_concurrent_searches = 8

[client]
endpoint = "http://127.0.0.1:50051"
bearer_token_env = "STRUDEL_RAG_BEARER_TOKEN"
timeout_secs = 30
connect_timeout_secs = 5
