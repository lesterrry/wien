[package]
name = "strudel-rag-grpc"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
strudel-rag-core = { path = "../strudel-rag-core" }
tokio = { version = "1", features = ["sync", "time", "net", "signal"] }
tonic = { version = "0.14", features = ["transport", "tls-native-roots", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
tonic-health = "0.14"
tonic-reflection = "0.14"
sha2 = "0.10"
subtle = "2"
tokio-stream = { version = "0.1", features = ["net"] }
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
http-body = "1"

[build-dependencies]
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3.3"

[dev-dependencies]
strudel-rag-core = { path = "../strudel-rag-core", features = ["test-support"] }
tempfile = "3"
async-trait = "0.1"
serde_json = "1"
