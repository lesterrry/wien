[package]
name = "strudel-rag-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "strudel-rag"
path = "src/main.rs"

[features]
default = []
fixture-provider = ["strudel-rag-core/test-support"]

[dependencies]
strudel-rag-core = { path = "../strudel-rag-core" }
strudel-rag-grpc = { path = "../strudel-rag-grpc" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
