name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint, formatting, types, and tests
        run: pnpm test

      - name: Build client
        run: pnpm build

  server:
    name: Server checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test without credentials or external model calls
        run: cargo test --locked

      - name: Check generated OpenAPI and HTTP requests
        run: bash scripts/generate-http.sh --check

      - name: Build server
        run: cargo build --locked --release

  skill:
    name: Skill checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skill
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test without credentials or external model calls
        run: cargo test --locked --workspace --all-features

      - name: Build production CLI
        run: cargo build --locked --release -p strudel-rag-cli

      - name: Build fixture CLI
        run: cargo build --locked -p strudel-rag-cli --features fixture-provider

      - name: Smoke-test fixture retrieval
        shell: bash
        run: |
          rag=(
            ./target/debug/strudel-rag
            --config config.fixture.toml
            --data-dir "$RUNNER_TEMP/strudel-rag-fixture"
            --allow-fixture
          )
          "${rag[@]}" ingest
          "${rag[@]}" index
          "${rag[@]}" search --query 'slow pattern cycles' --intent api --top-k 3
          "${rag[@]}" eval --dataset eval/fixture.jsonl --k 5
