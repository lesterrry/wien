name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: client

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint, formatting, types, and tests
        run: pnpm test

      - name: Build client
        run: pnpm build

  rust:
    name: Rust workspace checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: wien_test
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: wien_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wien_test -d wien_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust with rustfmt and Clippy
        run: rustup show

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --workspace --all-features

      - name: Test account lifecycle with PostgreSQL
        env:
          DATABASE_URL: postgresql://wien_test:test-only-password@127.0.0.1:5432/wien_test
        run: cargo test --locked -p wien-server --test accounts_db --test subscriptions_db -- --ignored

      - name: Check generated HTTP contract
        run: bash server/scripts/generate-http.sh --check

      - name: Build production binaries
        run: cargo build --locked --release -p wien-server -p strudel-rag-cli
