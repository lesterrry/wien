name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: client/package.json
          cache: true
          cache_dependency_path: client/pnpm-lock.yaml

      - name: Run client checks (same as just test)
        run: bash scripts/test.sh client

  rust:
    name: Rust workspace checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WIEN_HTTPGENERATOR_ROOT: ${{ github.workspace }}/.cache/httpgenerator
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pinned Rust with rustfmt and Clippy
        run: rustup show

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false

      - name: Cache HTTP generator
        uses: actions/cache@v5
        with:
          path: .cache/httpgenerator
          key: httpgenerator-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'server/scripts/generate-http.sh') }}

      - name: Run Rust checks (same as just test)
        run: bash scripts/test.sh rust
