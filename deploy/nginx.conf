server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name wien.aydar.media;
    client_max_body_size 256k;
    location = / { return 302 /docs/; }
    # Keep public inference disabled until accounts and authentication are implemented.
    location /v1/ {
        default_type application/json;
        return 503 '{"code":"provider_not_configured","message":"Generation is disabled on this server."}';
    }
    location / {
        proxy_pass http://server:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 130s;
    }
}
