# Production only: images come from CI, secrets and corpus stay on the VPS.
name: wien
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"
services:
  server:
    image: wien-server:${WIEN_RELEASE_ID:?Release ID is required}
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      WIEN_SERVER_HOST: 0.0.0.0
      WIEN_SERVER_PORT: "3001"
      WIEN_SERVER_CONFIG: /app/config.toml
      DATABASE_URL: postgresql://wien:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD on the VPS}@database:5432/wien
      AITUNNEL_KEY: ${AITUNNEL_KEY:?Set AITUNNEL_KEY on the VPS}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:?Set TURNSTILE_SITE_KEY on the VPS}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:?Set TURNSTILE_SECRET_KEY on the VPS}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:?Set TURNSTILE_HOSTNAMES on the VPS}
      STRUDEL_RAG_ENDPOINT: http://skill:50051
      STRUDEL_RAG_BEARER_TOKEN: ${STRUDEL_RAG_BEARER_TOKEN:?Set the RAG token on the VPS}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./server.toml:/app/config.toml:ro
    depends_on:
      database:
        condition: service_healthy
      skill:
        condition: service_healthy
    logging: *logging
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wien
      POSTGRES_DB: wien
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD on the VPS}
    volumes:
      - users-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wien -d wien"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *logging

  skill:
    image: wien-skill:${WIEN_RELEASE_ID:?Release ID is required}
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      AITUNNEL_KEY: ${AITUNNEL_KEY:?Set AITUNNEL_KEY on the VPS}
      STRUDEL_RAG_BEARER_TOKEN: ${STRUDEL_RAG_BEARER_TOKEN:?Set the RAG token on the VPS}
      STRUDEL_RAG_EMBEDDING_MODEL: ${STRUDEL_RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      RUST_LOG: ${RUST_LOG:-info}
    ports:
      - "127.0.0.1:50051:50051"
    volumes:
      - ./skill.toml:/app/config.toml:ro
      - skill-data:/var/lib/strudel-rag
      - /opt/wien/skill/saved_html:/app/saved_html:ro
    logging: *logging
  proxy:
    image: wien-web:${WIEN_RELEASE_ID:?Release ID is required}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      server:
        condition: service_healthy
    logging: *logging
volumes:
  users-data:
    external: true
    name: wien_users-data
  skill-data:
    external: true
    name: wien_skill-data
